{% extends "base.html" %}
{% load static %}

{% block title %} Schedule {% endblock %}

{% block script %}
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Add assignments to calendar
      assignments = JSON.parse("{{ assignments }}".replace(/&#x27;/g,'"'))
      Object.keys(assignments).forEach(class_ => {
        a = assignments[class_]
        for (i = 0; i < a.length; i++)
        {
          d = new Date(a[i]['deadline'])
          if (d.getFullYear() === currentYear && d.getMonth() === currentMonth)
          {
            document.querySelectorAll('.date-picker').forEach(dp => {
              if (dp.dataset.year == d.getFullYear() && dp.dataset.month == d.getMonth() + 1 && dp.dataset.date == d.getDate())
              {
                dp.innerHTML += '<br>' + '<button type="button" class="unstyled-button assignment-button" data-assingmentid="' + a[i]['id'] + '" data-toggle="modal" data-target="#assignmentModal"><font size="2">' + a[i]['name'] + '</button></font>'
              }
            })
          }
        }
      })

      //document.querySelectorAll('.assignment-button')
    })
  </script>
{% endblock %}

{% block body %}
  <link href="{% static 'scheduler/styles.css' %}" rel="stylesheet"/>
  <link href="{% static 'scheduler/calendar.css' %}" rel="stylesheet"/>

  <div class="wrapper">
    <div class="container-calendar">
        <h3 id="monthAndYear"></h3>
        <div class="button-container-calendar">
            <button id="previous" onclick="previous()">&#8249;</button>
            <button id="next" onclick="next()">&#8250;</button>
        </div>
        
        <table class="table-calendar" id="calendar" data-lang="en">
            <thead id="thead-month"></thead>
            <tbody id="calendar-body"></tbody>
        </table>
        
        <div class="footer-container-calendar">
            <label for="month">Jump To: </label>
            <select id="month" onchange="jump()">
                <option value=0>Jan</option>
                <option value=1>Feb</option>
                <option value=2>Mar</option>
                <option value=3>Apr</option>
                <option value=4>May</option>
                <option value=5>Jun</option>
                <option value=6>Jul</option>
                <option value=7>Aug</option>
                <option value=8>Sep</option>
                <option value=9>Oct</option>
                <option value=10>Nov</option>
                <option value=11>Dec</option>
            </select>
            <select id="year" onchange="jump()"></select>       
        </div>
    </div>
  </div>

  <div class="modal fade" id="assignmentModal" tabindex="-1" role="dialog" aria-labelledby="assignmentModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="assignmentModalLabel">Modal title</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          ...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'scheduler/calendar.js' %}" type="text/javascript"></script>
{% endblock %}
