{% extends "base.html" %}
{% load static %}

{% block title %} Schedule {% endblock %}

{% block script %}
  <script id="calendar-item" type="text/x-handlebars-template">
    {% verbatim %}
      <button type="button" class="unstyled-button assignment-button" data-class="{{ class }}" data-no="{{ i }}" data-type = "{{ type }}" data-toggle="modal" data-target="#modal"><font size="2" color="{{ color }}">{{ text }}</button></font>
    {% endverbatim %}
  </script>

  <script id="class-name" type="text/x-handlebars-template">
    <div class="dropdown">
      <button class="btn btn-link dropdown-toggle"
              type="button" id="dropdownMenu1" data-toggle="dropdown"
              aria-haspopup="true" aria-expanded="false">
              {% verbatim %}{{ name }}{% endverbatim %}
      </button>
      {% if request.user.teacher %}
        <div class="dropdown-menu" aria-labelledby="dropdownMenu1">
          <a class="dropdown-item" href="#!">Class Info</a>
          <a class="dropdown-item" href="#!">Create Assignment</a>
        </div>
      {% endif %}
    </div>
  </script>

  <script>
    const calendar_item = Handlebars.compile(document.querySelector("#calendar-item").innerHTML)
    const class_name = Handlebars.compile(document.querySelector("#class-name").innerHTML)

    const d_ = new Date()
    var m = d_.getMonth()
    var data

    document.addEventListener('DOMContentLoaded', () => {
      vars = JSON.parse("{{ vars }}".replace(/&#x27;/g,'"'))

      change_height()

      document.querySelectorAll('.date-span').forEach(ds => {
        if (vars["holidays"].includes(parseInt(ds.parentElement.dataset.day))) {
          ds.style.color = "red"
        }
      })

      populate_calendar(m)

      timetable()
      enroll()

      window.addEventListener('resize', change_height)
    })

    function change_height() {
      document.querySelector('.sidebar').style.height = (window.innerHeight - 104).toString() + "px"
      document.querySelector('.wrapper').style.height = (window.innerHeight - 104).toString() + "px"

      //dph = Math.floor((document.querySelector('#calendar-body').offsetHeight) / (document.querySelector('#calendar-body').querySelectorAll('tr').length))

      //document.querySelector('#calendar-body').querySelectorAll('tr').forEach(dp => {
      //  dp.style.height = dph.toString() + "px"
      //})
    }

    function printDiv(elementId) {
      data = document.getElementById(elementId).innerHTML;
      window.frames["print_frame"].document.title = document.title;
      window.frames["print_frame"].document.body.innerHTML = `<style>
        .timetable{font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;width: 100%;border-collapse: separate;border-spacing: 3px;}
        .timetable td, .timetable th {border: 1px solid #ddd;padding: 8px;margin: 8px;}
        .timetable tr:nth-child(even){background-color: #f2f2f2;}
        .timetable th:nth-child(1){max-width: 30px;}
        .timetable td:nth-child(1){max-width: 30px;}
        .timetable th {padding-top: 12px;padding-bottom: 12px;text-align: left;}
      </style>` + data;
      window.frames["print_frame"].window.focus();
      window.frames["print_frame"].window.print();
    }

    function timetable() {
      document.querySelector('.timetable-btn').onclick = () => {
        setTimeout(function() {
          document.querySelector('.big-modal-title').innerHTML = "Student Timetable"
          document.querySelector('.big-modal-body').innerHTML = `
            <div id="timetable-printable">
              <table class="timetable">
                <thead class="timetable-head">
                  <tr class="timetable-head-row"></tr>
                </thead>
                <tbody class="timetable-body">
                </tbody>
              </table>
            </div>
            <button type="button" class="btn btn-link" onclick="printDiv('timetable-printable')">
              Print Timetable
            </button>
          `

          document.querySelector('.timetable-head-row').innerHTML += "<th>Period</th>"
          for (i = 0; i < data["days"].length; i++) {
            document.querySelector('.timetable-head-row').innerHTML += "<th>Day " + data["days"][i]["day"] + "</th>"
          }

          for (i = 0; i < data["slots"].length; i++) {
            document.querySelector('.timetable-body').innerHTML += `<tr class="timetable-row timetable-row-${i}"></tr>`
            currRow = document.querySelector(`.timetable-row-${i}`)
            currRow.innerHTML += `<td>${data["slots"][i]["name"]}<br>${data["slots"][i]["start"]} - ${data["slots"][i]["end"]}</td>`

            for (j = 0; j < data["days"].length; j++) {
              currRow.innerHTML += `<td class=schedule-data-${j}></td>`
              currData = currRow.querySelector(`.schedule-data-${j}`)

              for (k = 0; k < data["class"].length; k++) {
                for (l = 0; l < data["class"][k]["period"].length; l++) {
                  temp = data["class"][k]["period"][l]
                  
                  if (temp["day"]["id"] === data["days"][j]["id"] && temp["period"]["id"] === data["slots"][i]["id"]) {
                    currData.innerHTML = `${data["class"][k]["name"]}<br>${data["class"][k]["teacher"]}`
                  }
                }
              }
            }
          }
        }, 100)
      }
    }

    function enroll() {
      var enrollCode

      document.querySelector('.enroll-btn').onclick = () => {
        setTimeout(function() {
          document.querySelector('.modal-title').innerHTML = "Enroll in a Class"
          document.querySelector('.modal-body').innerHTML = `
            <div class="input-group">
              <input type="text" class="form-control enroll-code" placeholder="Enroll Code" aria-label="" aria-describedby="basic-addon1">
              <div class="input-group-append">
                <button class="btn btn-primary enroll-btn-1" type="button">Enroll</button>
              </div>
            </div>
            <p class="text-danger enroll-warn"></p>
          `
          document.querySelector('.enroll-btn-1').onclick = () => {
            enrollCode = document.querySelector('.enroll-code').value
            if (enrollCode == "") {
              document.querySelector('.enroll-warn').innerHTML = "Please enter an enroll code."
            }
            else {
              document.querySelector('.enroll-warn').innerHTML = ""
              r = new XMLHttpRequest()
              r.open("GET", "{% url 'enroll' %}?code=" + enrollCode)
              r.onload = () => {
                res = JSON.parse(r.responseText)
                if (res["status"] == "error") {
                  document.querySelector('.enroll-warn').innerHTML = res["data"]
                }
                else {
                  document.querySelector('.modal-body').innerHTML = `
                    <center><h4>Enroll?</h4></center>
                    <p>Class name: ${res["data"]["name"]}</p>
                    <p>Teacher: ${res["data"]["teacher"]}</p>
                    <button type="submit" class="btn btn-success enroll-confirm-btn" style="width: 100%;">Enroll</button>
                    <br><br>
                    <a href="{% url 'index' %}"><button type="submit" class="btn btn-danger" style="width: 100%;" data-dismiss="modal">Don't Enroll</button></a>
                    <strong><p class="text-warning">WARNING: Do NOT enroll in a class that you are not really in.</p></strong>
                  `
                  document.querySelector('.enroll-confirm-btn').onclick = () => {
                    r = new XMLHttpRequest()
                    r.open("POST", "{% url 'enroll' %}?code=" + enrollCode)
                    r.setRequestHeader("X-CSRFToken", "{{ csrf_token }}")
                    r.onload = () => {
                      res = JSON.parse(r.responseText)
                      if (res["status"] == "error") {
                        document.querySelector('.modal-body').innerHTML = `<p class="text-danger enroll-warn" style="font-size: 15px;">ERROR: ${res["data"]}</p>`
                      }
                      else {
                        document.querySelector('.modal-body').innerHTML = `
                          <p class="text-success enroll-warn" style="font-size: 15px;">You are successfully enrolled in the class.</p>
                          <p>This page will automatically refresh. Please wait...</p>
                        `
                        setTimeout(function() {
                          location.reload()
                        }, 1000)
                      }
                    }
                    r.send()
                  }
                }
              }
              r.send()
            }
          }
        }, 100)
      }
    }

    function add_click_listener_to_dates() {
      document.querySelectorAll('.date-span').forEach(ds => {
        dp = ds.parentElement
        if (vars["holidays"].includes(parseInt(dp.dataset.day))) {
          ds.style.color = "red"
        }
        ds.onclick = () => {
          setTimeout(function() {
            dp = ds.parentElement
            document.querySelector('.big-modal-title').innerHTML = dp.dataset.date + " " + months[m]
            document.querySelector('.big-modal-body').innerHTML = ""

            e = data["events"]
            for (i = 0; i < e.length; i++)
            {
              sd = new Date(e[i]['startdate'])
              ed = new Date(e[i]['startdate'])
              document.querySelectorAll('.date-picker').forEach(dp => {
                td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
                if (sd.toDateString() <= td.toDateString() && td.toDateString() <= ed.toDateString())
                {
                  // Add to modal
                }
              })
            }

            a = data["assignments"]
            for (i = 0; i < a.length; i++)
            {
              d = new Date(a[i]['deadline'])
                document.querySelectorAll('.date-picker').forEach(dp => {
                td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
                if (d.toDateString() == td.toDateString())
                {
                  // Add to modal
                }
              })
            }

          }, 100)
        }
      })
    }

    function populate_calendar(time) {
      // Add assignments to calendar

      r = new XMLHttpRequest()
      r.open("GET", "{% url 'data' %}?timespan=month&time=" + time)
      r.onload = () => {
        data = JSON.parse(r.responseText.replace(/&#x27;/g,'"'))["data"]
        console.log(data)

        document.querySelector('.classlist').innerHTML = ""

        c = data["class"]
        for (i = 0; i < c.length; i++) {
          document.querySelector('.classlist').innerHTML += class_name({"name": c[i]["name"]})
        }

        e = data["events"]
        for (i = 0; i < e.length; i++)
        {
          sd = new Date(e[i]['startdate'])
          ed = new Date(e[i]['startdate'])
          document.querySelectorAll('.date-picker').forEach(dp => {
            td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
            if (sd.toDateString() <= td.toDateString() && td.toDateString() <= ed.toDateString())
            {
              dp.innerHTML += '<br>'
              var ci = calendar_item({'class': e[i]['class'], 'i': i, 'type': "event", 'color': "cornflowerblue", 'text': e[i]['name']})
              dp.innerHTML += ci
            }
          })
        }

        oe = data["org_events"]
        for (i = 0; i < oe.length; i++)
        {
          sd = new Date(oe[i]['startdate'])
          ed = new Date(oe[i]['startdate'])
          document.querySelectorAll('.date-picker').forEach(dp => {
            td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
            if (sd.toDateString() <= td.toDateString() && td.toDateString() <= ed.toDateString())
            {
              dp.innerHTML += '<br>'
              var ci = calendar_item({'class': oe[i]['class'], 'i': i, 'type': "org_event", 'color': "green", 'text': oe[i]['name']})
              dp.innerHTML += ci
              if (oe[i]['holiday'] == true) {
                dp.querySelector('span').style.color = "red"
              }
            }
          })
        }

        a = data["assignments"]
        for (i = 0; i < a.length; i++)
        {
          d = new Date(a[i]['deadline'])
            document.querySelectorAll('.date-picker').forEach(dp => {
            td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
            if (d.toDateString() == td.toDateString())
            {
              dp.innerHTML += '<br>'
              var ci = calendar_item({'class': a[i]['class'], 'i': i, 'type': "assignment", 'color': "black", 'text': a[i]['name'] + " [" + a[i]['class']['name'] + "]"})
              dp.innerHTML += ci
            }
          })
        }

        change_height()

        // Show information about the assignment on the modal
        document.querySelectorAll('.assignment-button').forEach(button => {
          button.onclick = () => {
            setTimeout(function() {
              if (button.dataset.type == "assignment") {
                assignment = data["assignments"][button.dataset.no]
                document.querySelector('.modal-title').innerHTML = assignment["name"]
                document .querySelector('.modal-body').innerHTML = ""
                document .querySelector('.modal-body').innerHTML = `
                  For: ${assignment["class"]['name']}<br>
                  Due: ${assignment["deadline"]}<br>
                  Description: ${assignment["description"]}<br>
                  Graded: ${assignment["graded"]}<br>`
                  if (assignment["url"] != "N/A")
                  {
                    document .querySelector('.modal-body').innerHTML += `URL: <a href="${assignment["url"]}" target="_blank">Link to assignment</a>`
                  }
              }
              else if (button.dataset.type == "event") {
                event = data["events"][button.dataset.no]
                document.querySelector('.modal-title').innerHTML = event["name"]
                document .querySelector('.modal-body').innerHTML = ""
                document .querySelector('.modal-body').innerHTML = `
                  For: ${event["class"]['name']}<br>
                  Start Date: ${event["startdate"]}<br>
                  End Date: ${event["enddate"]}<br>
                  Description: ${event["description"]}<br>`
              }

              else if (button.dataset.type == "org_event") {
                event = data["org_events"][button.dataset.no]
                document.querySelector('.modal-title').innerHTML = event["name"]
                document .querySelector('.modal-body').innerHTML = ""
                document .querySelector('.modal-body').innerHTML = `
                  Start Date: ${event["startdate"]}<br>
                  End Date: ${event["enddate"]}<br>
                  Description: ${event["description"]}<br>`
              }
            }, 100)
          }
        })

        add_click_listener_to_dates()
      }
      r.send()
    }

    function go_prev() {
      m -= 1
      previous()
      populate_calendar(m)
    }

    function go_next() {
      m += 1
      next()
      populate_calendar(m)
    }

    function jump_() {
      jump()
      m = document.querySelector("#month").value
      populate_calendar(m)
    }
  </script>
{% endblock %}

{% block body %}
  <link href="{% static 'scheduler/styles.css' %}" rel="stylesheet" media="all"/>
  <link href="{% static 'scheduler/calendar.css' %}" rel="stylesheet" media="all"/>

  <div class="main-container">
    <div class="sidebar jumbotron">
      <div>
        <font size=4>
          {% if request.user.teacher %}
            Enrolled / Teaching:
          {% else %}
            Enrolled:
          {% endif %}
        </font>
        <div class="classlist">

        </div>
        <button type="button" class="btn btn-info enroll-btn" data-toggle="modal" data-target="#modal"><i class="far fa-plus-square"></i></button>
        <button type="button" class="btn btn-info timetable-btn" data-toggle="modal" data-target="#big-modal"><i class="far fa-calendar-alt"></i></button>
      </div>
    </div>

    <div class="wrapper">
      <div class="container-calendar">
          <h3 id="monthAndYear"></h3>
          <div class="button-container-calendar">
              <button id="previous" onclick="go_prev()">&#8249;</button>
              <button id="next" onclick="go_next()">&#8250;</button>
          </div>
          
          <table class="table-calendar" id="calendar" data-lang="en">
              <thead id="thead-month"></thead>
              <tbody id="calendar-body"></tbody>
          </table>
          
          <div class="footer-container-calendar">
              <label for="month">Jump To: </label>
              <select id="month" onchange="jump_()">
                  <option value=0>Jan</option>
                  <option value=1>Feb</option>
                  <option value=2>Mar</option>
                  <option value=3>Apr</option>
                  <option value=4>May</option>
                  <option value=5>Jun</option>
                  <option value=6>Jul</option>
                  <option value=7>Aug</option>
                  <option value=8>Sep</option>
                  <option value=9>Oct</option>
                  <option value=10>Nov</option>
                  <option value=11>Dec</option>
              </select>
              <select id="year" onchange="jump_()"></select>       
          </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLabel">Loading...</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="big-modal" tabindex="-1" role="dialog"aria-labelledby="myHugeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content big-modal-content">
        <div class="modal-header big-modal-header">
          <h5 class="modal-title big-modal-title" id="modalLabel">Loading...</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body big-modal-body">
        </div>
        <div class="modal-footer big-modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <iframe id="printing-frame" name="print_frame" src="about:blank" style="display:none;"></iframe>

  <script src="{% static 'scheduler/calendar.js' %}" type="text/javascript"></script>
{% endblock %}
