{% extends "base.html" %}
{% load static %}

{% block title %} Schedule {% endblock %}

{% block script %}
  <script id="calendar-item" type="text/x-handlebars-template">
    {% verbatim %}
      <button type="button" class="unstyled-button assignment-button" data-class="{{ class }}" data-no="{{ i }}" data-type = "{{ type }}" data-toggle="modal" data-target="#modal"><font size="2" color="{{ color }}">{{ text }}</button></font>
    {% endverbatim %}
  </script>

  <script id="class" type="text/x-handlebars-template">
    {% verbatim %}
      
    {% endverbatim %}
  </script>

  <script>
    const calendar_item = Handlebars.compile(document.querySelector("#calendar-item").innerHTML)
    const d_ = new Date()
    var m = d_.getMonth()
    var data

    document.addEventListener('DOMContentLoaded', () => {
      vars = JSON.parse("{{ vars }}".replace(/&#x27;/g,'"'))

      change_height()

      document.querySelectorAll('.date-span').forEach(ds => {
        if (vars["holidays"].includes(parseInt(ds.parentElement.dataset.day))) {
          ds.style.color = "red"
        }
      })

      populate_calendar(m)

      enroll()

      window.addEventListener('resize', change_height)
    })

    function change_height() {
      document.querySelector('.sidebar').style.height = (window.innerHeight - 104).toString() + "px"
      document.querySelector('.wrapper').style.height = (window.innerHeight - 104).toString() + "px"

      //dph = Math.floor((document.querySelector('#calendar-body').offsetHeight) / (document.querySelector('#calendar-body').querySelectorAll('tr').length))

      //document.querySelector('#calendar-body').querySelectorAll('tr').forEach(dp => {
      //  dp.style.height = dph.toString() + "px"
      //})
    }

    function enroll() {
      var enrollCode

      document.querySelector('.enroll-btn').onclick = () => {
        setTimeout(function() {
          document.querySelector('.modal-title').innerHTML = "Enroll in a Class"
          document.querySelector('.modal-body').innerHTML = `
            <div class="input-group">
              <input type="text" class="form-control enroll-code" placeholder="Enroll Code" aria-label="" aria-describedby="basic-addon1">
              <div class="input-group-append">
                <button class="btn btn-primary enroll-btn-1" type="button">Enroll</button>
              </div>
            </div>
            <p class="text-danger enroll-warn"></p>
          `
          document.querySelector('.enroll-btn-1').onclick = () => {
            enrollCode = document.querySelector('.enroll-code').value
            if (enrollCode == "") {
              document.querySelector('.enroll-warn').innerHTML = "Please enter an enroll code."
            }
            else {
              document.querySelector('.enroll-warn').innerHTML = ""
              r = new XMLHttpRequest()
              r.open("GET", "{% url 'enroll' %}?code=" + enrollCode)
              r.onload = () => {
                res = JSON.parse(r.responseText)
                if (res["status"] == "error") {
                  document.querySelector('.enroll-warn').innerHTML = res["data"]
                }
                else {
                  document.querySelector('.modal-body').innerHTML = `
                    <center><h4>Enroll?</h4></center>
                    <p>Class name: ${res["data"]["name"]}</p>
                    <p>Teacher: ${res["data"]["teacher"]}</p>
                    <button type="submit" class="btn btn-success enroll-confirm-btn" style="width: 100%;">Enroll</button>
                    <br><br>
                    <a href="{% url 'index' %}"><button type="submit" class="btn btn-danger" style="width: 100%;" data-dismiss="modal">Don't Enroll</button></a>
                    <strong><p class="text-warning">WARNING: Do NOT enroll in a class that you are not really in.</p></strong>
                  `
                  document.querySelector('.enroll-confirm-btn').onclick = () => {
                    r = new XMLHttpRequest()
                    r.open("POST", "{% url 'enroll' %}?code=" + enrollCode)
                    r.setRequestHeader("X-CSRFToken", "{{ csrf_token }}")
                    r.onload = () => {
                      res = JSON.parse(r.responseText)
                      if (res["status"] == "error") {
                        document.querySelector('.modal-body').innerHTML = `<p class="text-danger enroll-warn" style="font-size: 15px;">ERROR: ${res["data"]}</p>`
                      }
                      else {
                        document.querySelector('.modal-body').innerHTML = `
                          <p class="text-success enroll-warn" style="font-size: 15px;">You are successfully enrolled in the class.</p>
                          <p>This page will automatically refresh. Please wait...</p>
                        `
                        setTimeout(function() {
                          location.reload()
                        }, 1000)
                      }
                    }
                    r.send()
                  }
                }
              }
              r.send()
            }
          }
        }, 100)
      }
    }

    function add_click_listener_to_dates() {
      document.querySelectorAll('.date-span').forEach(ds => {
        dp = ds.parentElement
        if (vars["holidays"].includes(parseInt(dp.dataset.day))) {
          ds.style.color = "red"
        }
        ds.onclick = () => {
          setTimeout(function() {
            dp = ds.parentElement
            document.querySelector('.modal-title').innerHTML = dp.dataset.date + " " + months[m]
            document.querySelector('.modal-body').innerHTML = ""

            e = data["events"]
            for (i = 0; i < e.length; i++)
            {
              sd = new Date(e[i]['startdate'])
              ed = new Date(e[i]['startdate'])
              document.querySelectorAll('.date-picker').forEach(dp => {
                td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
                if (sd.toDateString() <= td.toDateString() && td.toDateString() <= ed.toDateString())
                {
                  // Add to modal
                }
              })
            }

            a = data["assignments"]
            for (i = 0; i < a.length; i++)
            {
              d = new Date(a[i]['deadline'])
                document.querySelectorAll('.date-picker').forEach(dp => {
                td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
                if (d.toDateString() == td.toDateString())
                {
                  // Add to modal
                }
              })
            }

          }, 100)
        }
      })
    }

    function populate_calendar(time) {
      // Add assignments to calendar

      r = new XMLHttpRequest()
      r.open("GET", "{% url 'data' %}?timespan=month&time=" + time)
      r.onload = () => {
        data = JSON.parse(r.responseText.replace(/&#x27;/g,'"'))["data"]

        document.querySelector('.classlist').innerHTML = ""

        c = data["class"]
        for (i = 0; i < c.length; i++) {
          document.querySelector('.classlist').innerHTML += '<button type="button" class="btn btn-link">' + c[i]["name"] + '</button>' + '<br>'
        }

        e = data["events"]
        for (i = 0; i < e.length; i++)
        {
          sd = new Date(e[i]['startdate'])
          ed = new Date(e[i]['startdate'])
          document.querySelectorAll('.date-picker').forEach(dp => {
            td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
            if (sd.toDateString() <= td.toDateString() && td.toDateString() <= ed.toDateString())
            {
              dp.innerHTML += '<br>'
              var ci = calendar_item({'class': e[i]['class'], 'i': i, 'type': "event", 'color': "cornflowerblue", 'text': e[i]['name']})
              dp.innerHTML += ci
              if (e[i]['holiday'] == true) {
                dp.querySelector('span').style.color = "red"
              }
            }
          })
        }

        a = data["assignments"]
        for (i = 0; i < a.length; i++)
        {
          d = new Date(a[i]['deadline'])
            document.querySelectorAll('.date-picker').forEach(dp => {
            td = new Date(dp.dataset.year, dp.dataset.month - 1, dp.dataset.date)
            if (d.toDateString() == td.toDateString())
            {
              dp.innerHTML += '<br>'
              var ci = calendar_item({'class': a[i]['class'], 'i': i, 'type': "assignment", 'color': "black", 'text': a[i]['name'] + " [" + a[i]['class']['name'] + "]"})
              dp.innerHTML += ci
            }
          })
        }

        change_height()

        // Show information about the assignment on the modal
        document.querySelectorAll('.assignment-button').forEach(button => {
          button.onclick = () => {
            setTimeout(function() {
              if (button.dataset.type == "assignment") {
                assignment = data["assignments"][button.dataset.no]
                document.querySelector('.modal-title').innerHTML = assignment["name"]
                document .querySelector('.modal-body').innerHTML = ""
                document .querySelector('.modal-body').innerHTML = `
                  For: ${assignment["class"]['name']}<br>
                  Due: ${assignment["deadline"]}<br>
                  Description: ${assignment["description"]}<br>
                  Graded: ${assignment["graded"]}<br>`
                  if (assignment["url"] != "N/A")
                  {
                    document .querySelector('.modal-body').innerHTML += `URL: <a href="${assignment["url"]}" target="_blank">Link to assignment</a>`
                  }
              }
              else {
                event = data["events"][button.dataset.no]
                document.querySelector('.modal-title').innerHTML = event["name"]
                document .querySelector('.modal-body').innerHTML = ""
                document .querySelector('.modal-body').innerHTML = `
                  For: ${event["class"]['name']}<br>
                  Start Date: ${event["startdate"]}<br>
                  End Date: ${event["enddate"]}<br>
                  Description: ${event["description"]}<br>`
              }
            }, 100)
          }
        })

        add_click_listener_to_dates()
      }
      r.send()
    }

    function go_prev() {
      m -= 1
      previous()
      populate_calendar(m)
    }

    function go_next() {
      m += 1
      next()
      populate_calendar(m)
    }

    function jump_() {
      jump()
      m = document.querySelector("#month").value
      populate_calendar(m)
    }
  </script>
{% endblock %}

{% block body %}
  <link href="{% static 'scheduler/styles.css' %}" rel="stylesheet"/>
  <link href="{% static 'scheduler/calendar.css' %}" rel="stylesheet"/>

  <div class="main-container">
    <div class="sidebar jumbotron">
      <div>
        <font size=4>Enrolled:</font>
        <div class="classlist">

        </div>
        <button type="button" class="btn btn-info enroll-btn" data-toggle="modal" data-target="#modal">+</button>
      </div>
    </div>

    <div class="wrapper">
      <div class="container-calendar">
          <h3 id="monthAndYear"></h3>
          <div class="button-container-calendar">
              <button id="previous" onclick="go_prev()">&#8249;</button>
              <button id="next" onclick="go_next()">&#8250;</button>
          </div>
          
          <table class="table-calendar" id="calendar" data-lang="en">
              <thead id="thead-month"></thead>
              <tbody id="calendar-body"></tbody>
          </table>
          
          <div class="footer-container-calendar">
              <label for="month">Jump To: </label>
              <select id="month" onchange="jump_()">
                  <option value=0>Jan</option>
                  <option value=1>Feb</option>
                  <option value=2>Mar</option>
                  <option value=3>Apr</option>
                  <option value=4>May</option>
                  <option value=5>Jun</option>
                  <option value=6>Jul</option>
                  <option value=7>Aug</option>
                  <option value=8>Sep</option>
                  <option value=9>Oct</option>
                  <option value=10>Nov</option>
                  <option value=11>Dec</option>
              </select>
              <select id="year" onchange="jump_()"></select>       
          </div>
      </div>
    </div>
  </div>
